<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">平台接入关系</title><desc id="desc">AIQuota5h分别读取Codex、Claude Code官方订阅、Antigravity和Grok。Codex支持条件激活；Claude独立官方订阅支持5小时条件激活，周额度固定恢复；Antigravity的Gemini和Claude共享池分别显示5小时及周额度，Gemini4 Argon仅周额度；Antigravity隔离待验证，Grok费用待验证。</desc>
