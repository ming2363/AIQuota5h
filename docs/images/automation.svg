<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">到期自动检查，符合条件才激活</title><desc id="desc">后台默认每60秒读取额度。旧周期结束满120秒后核对账号、窗口、费用和防重发条件。条件通过只发送一条，随后核验；未通过保持等待。读取与激活都有历史。</desc>
