<text x="500.0" y="456" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">开关控制 · 后台常驻</text>
<rect x="680" y="435" width="400" height="30" rx="15" fill="#eff6ff" stroke="none"/>
<text x="880.0" y="456" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">启动核验 · 同周期不重复发送</text>
<text x="560" y="500" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">适用于需要首次请求启动计时的窗口</text>
