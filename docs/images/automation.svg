<text x="960.0" y="456" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">操作历史留在本机</text>
<text x="560" y="500" font-size="14" fill="#64748b" font-weight="400" text-anchor="middle">实际发送能力取决于渠道；见接入图</text>
