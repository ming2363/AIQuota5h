<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">到期主动激活，把窗口计时放在空闲期间</title><desc id="desc">五小时窗口的示例：旧窗口09:00结束，用户13:00开始工作，一小时用完额度。等使用时才激活的窗口18:00到期；到期主动激活可让下一窗口更早到期。为说明原理，图中忽略复核和请求耗时，不代表实测性能。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 3.5L0 7Z" fill="#2563eb"/></marker></defs>
<rect x="1" y="1" width="1118" height="648" rx="24" fill="#f8fbff" stroke="#dce6f1"/>
<text x="40" y="56" font-size="30" fill="#14253f" font-weight="700" text-anchor="start">让窗口计时，发生在你空闲的时候。</text>
<text x="40" y="94" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">示例：09:00 旧窗口结束，13:00 开工，1 小时用完本轮额度</text>
<rect x="884" y="34" width="196" height="30" rx="15" fill="#eff6ff" stroke="none"/>
<text x="982.0" y="55" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">5h 窗口示意</text>
<path d="M270 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M540 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M630 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M720 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M810 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M900 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M990 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1080 188V526" fill="none" stroke="#e4ebf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="174" font-size="17" fill="#64748b" font-weight="500" text-anchor="middle">09:00</text>
<text x="630" y="174" font-size="17" fill="#64748b" font-weight="500" text-anchor="middle">13:00</text>
<text x="720" y="174" font-size="17" fill="#64748b" font-weight="500" text-anchor="middle">14:00</text>
<text x="1080" y="174" font-size="17" fill="#64748b" font-weight="500" text-anchor="middle">18:00</text>
<text x="40" y="273" font-size="23" fill="#14253f" font-weight="700" text-anchor="start">等使用才激活</text>
<text x="40" y="305" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">开工时才开始计时</text>
<rect x="270" y="246" width="360" height="70" rx="10" fill="#f0f3f8" stroke="none"/>
<text x="450" y="289" font-size="20" fill="#64748b" font-weight="500" text-anchor="middle">空闲 · 还没开始计时</text>
<rect x="630" y="246" width="90" height="70" rx="0" fill="#def6ed" stroke="none"/>
<text x="675" y="289" font-size="20" fill="#047857" font-weight="600" text-anchor="middle">使用</text>
<rect x="720" y="246" width="360" height="70" rx="10" fill="#fff0e5" stroke="none"/>
<text x="900" y="289" font-size="20" fill="#b45309" font-weight="600" text-anchor="middle">用完后，还要等到 18:00</text>
<path d="M630 236V222H1080V236" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="855" y="211" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle">13:00 启动 → 18:00 到期</text>
<text x="40" y="457" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start">AIQuota5h</text>
<text x="40" y="490" font-size="18" fill="#2563eb" font-weight="600" text-anchor="start">到期主动激活</text>
<rect x="270" y="426" width="360" height="70" rx="10" fill="#e7f0ff" stroke="none"/>
<text x="450" y="469" font-size="20" fill="#2563eb" font-weight="600" text-anchor="middle">空闲期间，窗口已在计时</text>
<rect x="630" y="426" width="90" height="70" rx="0" fill="#def6ed" stroke="none"/>
<text x="675" y="469" font-size="20" fill="#047857" font-weight="600" text-anchor="middle">使用</text>
<path d="M270 416V402H720V416" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="495" y="390" font-size="17" fill="#2563eb" font-weight="500" text-anchor="middle">把计时起点放在旧窗口结束后</text>
<path d="M720 461H752" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M752.0 461.0L742.0 464.5L742.0 457.5Z" fill="#2563eb"/>
<rect x="760" y="433" width="320" height="56" rx="12" fill="white" stroke="#bfdbfe"/>
<text x="920" y="469" font-size="23" fill="#2563eb" font-weight="700" text-anchor="middle">下一轮更早到来</text>
<rect x="270" y="555" width="18" height="18" rx="4" fill="#e7f0ff" stroke="none"/>
<text x="298" y="570" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">空闲期间计时</text>
<rect x="500" y="555" width="18" height="18" rx="4" fill="#def6ed" stroke="none"/>
<text x="528" y="570" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">实际使用</text>
<rect x="700" y="555" width="18" height="18" rx="4" fill="#fff0e5" stroke="none"/>
<text x="728" y="570" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">用完后的等待</text>
<text x="560" y="609" font-size="24" fill="#14253f" font-weight="700" text-anchor="middle">启动更早 → 后续窗口更早到来</text>
<text x="560" y="635" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">5h 窗口计时原理示意</text>
</svg>
